<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.85em' font-size='70' x='50%25' text-anchor='middle'>🐉</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Pentagi</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <div class="auth-page">
        
        <a href="login.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>
        
        <!-- ========== STEP 1: ENTER EMAIL ========== -->
        <div class="auth-card" id="forgotStep1">
            <div class="auth-logo">
                <span class="logo-icon"><i class="fas fa-cube"></i></span>
                <span class="logo-text">PENTAGI</span>
            </div>
            
            <h2>Forgot Password</h2>
            <p class="auth-subtitle">Enter your email and we'll send you a reset code</p>
            
            <div class="input-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="resetEmail" placeholder="Enter your email" required>
                </div>
            </div>
            
            <div id="forgotError" class="form-error" style="display:none;"></div>
            
            <button class="btn-auth-submit" onclick="sendResetCode()">
                <i class="fas fa-paper-plane"></i> Send Reset Code
            </button>
        </div>
        
        <!-- ========== STEP 2: ENTER CODE + NEW PASSWORD ========== -->
        <div class="auth-card" id="forgotStep2" style="display:none;">
            <div class="auth-logo">
                <span class="logo-icon"><i class="fas fa-cube"></i></span>
                <span class="logo-text">PENTAGI</span>
            </div>
            
            <h2>Reset Password</h2>
            <p class="auth-subtitle">Code sent to <strong id="resetDisplayEmail" style="color: var(--text-primary);"></strong></p>
            
            <div class="input-group">
                <label>Reset Code</label>
                <div class="input-wrapper">
                    <i class="fas fa-key"></i>
                    <input type="text" id="resetCode" placeholder="Enter 6-digit code" maxlength="6">
                </div>
            </div>
            
            <div class="input-group">
                <label>New Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="newPassword" placeholder="Min 8 chars, 1 uppercase, 1 number" minlength="8">
                </div>
            </div>
            
            <div class="input-group">
                <label>Confirm New Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-check"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password">
                </div>
            </div>
            
            <div id="resetError" class="form-error" style="display:none;"></div>
            <div id="resetSuccess" class="form-success" style="display:none;"></div>
            
            <button class="btn-auth-submit" onclick="resetPassword()">
                <i class="fas fa-save"></i> Reset Password
            </button>
        </div>
        
    </div>

    <script src="js/main.js"></script>
    
    <script>
        const MAIL_WORKER = 'https://pentagi-mail.forestfire14578.workers.dev';
        let resetCode = '';
        let resetEmail = '';
        
        async function sendResetCode() {
            const email = document.getElementById('resetEmail').value.trim();
            const errorDiv = document.getElementById('forgotError');
            errorDiv.style.display = 'none';
            
            if (!email) {
                showError(errorDiv, 'Please enter your email.');
                return;
            }
            
            // Check if account exists
            const users = await getUsers();
            const user = users.find(u => u.email.toLowerCase() === email.toLowerCase());
            
            if (!user) {
                showError(errorDiv, 'No account found with that email.');
                return;
            }
            
            resetEmail = email;
            resetCode = Math.floor(100000 + Math.random() * 900000).toString();
            
            // Send email
            try {
                const response = await fetch(MAIL_WORKER, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        code: resetCode,
                        username: user.username
                    })
                });
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('forgotStep1').style.display = 'none';
                    document.getElementById('forgotStep2').style.display = 'block';
                    document.getElementById('resetDisplayEmail').textContent = email;
                } else {
                    showError(errorDiv, 'Failed to send email. Try again.');
                }
            } catch (error) {
                showError(errorDiv, 'Email service error. Try again later.');
            }
        }
        
        async function resetPassword() {
            const code = document.getElementById('resetCode').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('resetError');
            const successDiv = document.getElementById('resetSuccess');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            if (code !== resetCode) {
                showError(errorDiv, 'Invalid reset code.');
                return;
            }
            
            if (newPassword.length < 8) {
                showError(errorDiv, 'Password must be at least 8 characters.');
                return;
            }
            
            if (!/[A-Z]/.test(newPassword)) {
                showError(errorDiv, 'Password must contain at least one uppercase letter.');
                return;
            }
            
            if (!/[0-9]/.test(newPassword)) {
                showError(errorDiv, 'Password must contain at least one number.');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showError(errorDiv, 'Passwords do not match.');
                return;
            }
            
            // Update in Supabase
            await supabaseQuery(`accounts?email=eq.${encodeURIComponent(resetEmail)}`, {
                method: 'PATCH',
                body: JSON.stringify({ password: newPassword })
            });
            
            successDiv.textContent = 'Password reset! Redirecting to login...';
            successDiv.style.display = 'block';
            
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        }
        
        function showError(div, message) {
            div.textContent = message;
            div.style.display = 'block';
            setTimeout(() => { div.style.display = 'none'; }, 5000);
        }
    </script>
</body>
</html>
